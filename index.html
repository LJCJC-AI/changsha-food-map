  ['湘菜家常', '湘菜 家常菜 正餐湘菜 湘菜&家常菜 湘菜＆家常菜'],
  ['地方风味', '川菜 新疆风味 东北菜 粤菜'],
  ['火锅串串', '火锅 麻辣烫 串串'],
  ['烧烤夜宵', '烧烤 烤肉 烤鱼 海鲜 夜宵大排档'],
  ['小吃卤味', '小吃 特色小吃 卤味 酱板鸭'],
  ['早餐粉面', '早餐 粉面'],
  ['甜品饮品', '甜品糖水 糖水 咖啡茶饮'],
  ['异国料理', '西餐 韩餐 韩式料理 寿司 日料 墨西哥风味'],
  ['风景', '景点 旅游景点'],
  ['KTV', ''],
  ['商场', '购物中心'],
  ['影院', '电影院 影城'],
  ['学校', '大学 高校 中学 小学 幼儿园'],
  ['漂亮饭', ''],
  ['其他', '']
];
const group = item => groups.find(([name, aliases]) => name === item.Category || aliases.split(' ').includes(item.Category))?.[0] ?? '其他';
const located = item => Number.isFinite(item.Lat) && Number.isFinite(item.Lon);
const pending = item => !located(item) || item.Approximate;
function cinemaFormat(item) {
  if (group(item) !== '影院') return '';
  if (item.ScreenFormat === 'IMAX' || item.ScreenFormat === '巨幕') return item.ScreenFormat;
  return /imax/i.test(item.Name) ? 'IMAX' : item.Name.includes('巨幕') ? '巨幕' : '';
}
const byId = id => document.getElementById(id);
const list = byId('list');
const search = byId('search');
const copyToast = byId('copy-toast');
let copyToastTimer;

async function copyName(name) {
  let copied = false;
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(name);
      copied = true;
    }
  } catch { /* Try the fallback for local files and browsers with clipboard restrictions. */ }
  if (!copied) {
    const focused = document.activeElement;
    const field = document.createElement('textarea');
    field.className = 'copy-buffer';
    field.value = name;
    document.body.append(field);
    try {
      field.select();
      copied = document.execCommand('copy');
    } catch { /* The browser blocked copying. */ }
    finally {
      field.remove();
      focused?.focus({preventScroll: true});
    }
  }
  clearTimeout(copyToastTimer);
  copyToast.textContent = copied ? '已复制' : '复制失败，请重试';
  copyToast.hidden = false;
  copyToastTimer = setTimeout(() => { copyToast.hidden = true; }, 900);
}

function enablePlaceCopy(element, item) {
  element.addEventListener('contextmenu', event => {
    event.preventDefault();
    copyName(item.Name);
  });
  element.addEventListener('keydown', event => {
    if (!(event.ctrlKey || event.metaKey) || event.altKey || event.shiftKey || event.key.toLowerCase() !== 'c') return;
    event.preventDefault();
    copyName(item.Name);
  });
}
const scenic = references.filter(point => point.Category === '风景');
const transit = references.filter(point => point.Category === '地铁');
let filter = '全部';
let showMetro = false;
let showScenic = false;
let showKtv = false;
let showMalls = false;
let showCinemas = false;
let showSchools = false;
let selected;
let activePopup;
let map;
const markers = [];
let labelFrame;
function refreshLabels() {
  if (!map || labelFrame) return;
  labelFrame = requestAnimationFrame(() => {
    labelFrame = null;
    const {clientWidth: width, clientHeight: height} = map.getContainer();
    const occupied = [];
    const entries = markers.map(marker => {
      const element = marker.getElement();
      return {marker, label: element.querySelector('.pin-label'), badge: element.querySelector('.screen-badge'), kind: element.dataset.kind,
        point: map.project(marker.getLngLat())};
    });
    const radius = pinSize / 2 + 1;
    const pins = entries.map(({point: {x, y}}) => ({left:x-radius, top:y-radius, right:x+radius, bottom:y+radius}));
    for (const {badge, point: {x, y}} of entries) {
      if (!badge) continue;
      const left = x - pinSize / 2 + badge.offsetLeft;
      const top = y - pinSize / 2 + badge.offsetTop;
      pins.push({left, top, right: left + badge.offsetWidth, bottom: top + badge.offsetHeight});
    }
    entries.sort((a, b) => priority(a) - priority(b));
    for (const entry of entries) {
      const {label, point: {x, y}} = entry;
      const w = label.offsetWidth, h = label.offsetHeight;
      const position = x >= 0 && x <= width && y >= 0 && y <= height
        ? labelPosition(x, y, w, h, width, height, pins, occupied) : null;
      label.classList.toggle('shown', !!position);
      if (position) {
        label.style.setProperty('--label-x', (position.left - x + pinSize / 2) + 'px');
        label.style.setProperty('--label-y', (position.top - y + pinSize / 2) + 'px');
        occupied.push(position);
      }
    }
  });
}
function labelPosition(x, y, w, h, width, height, pins, occupied) {
  const gap = pinSize / 2 + 4;
  for (const [left, top] of [[x+gap,y-h/2],[x-w/2,y-gap-h],[x-w/2,y+gap],[x-gap-w,y-h/2]]) {
    const box = {left, top, right:left+w, bottom:top+h};
    if (left < 2 || top < 2 || box.right > width-2 || box.bottom > height-2) continue;
    const misses = (other, padding) => box.left >= other.right+padding || box.right <= other.left-padding ||
      box.top >= other.bottom+padding || box.bottom <= other.top-padding;
    if (pins.every(pin => misses(pin, 1)) && occupied.every(label => misses(label, 3))) return box;
  }
  return null;
}
function priority(entry) {
  if (entry.marker.getPopup().isOpen()) return -1;
  return entry.kind === 'rail' ? 2 : entry.kind === 'scenic' ? 1 : 0;
}
if (window.maplibregl) {
  const container = byId('map');
  const fallback = container.firstElementChild;
  try {
    container.replaceChildren();
    map = new maplibregl.Map({ container, minZoom: 5, maxZoom: 19, center: [112.978, 28.195],
      zoom: 11, style: 'https://tiles.openfreemap.org/styles/liberty' });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
    byId('layers').hidden = false;
    const status = byId('map-status');
    map.on('error', () => {
      if (!map.isStyleLoaded()) {
        status.textContent = '底图暂时无法加载，仍可查看地点标记和列表。';
        status.hidden = false;
      }
    });
    map.on('idle', () => { status.hidden = true; refreshLabels(); });
    map.on('move', refreshLabels);
    map.on('resize', refreshLabels);
  } catch (error) {
    map = null;
    container.replaceChildren(fallback);
  }
}
function text(tag, value, className) {
  const element = document.createElement(tag);
  element.textContent = value;
  if (className) element.className = className;
  return element;
}
function mapIcon(category) {
  const symbol = mapIcons[category] ?? mapIcons['其他'];
  const namespace = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(namespace, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(namespace, 'path');
  path.setAttribute('d', symbol.path);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', 'currentColor');
  path.setAttribute('stroke-width', '1.9');
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');
  svg.append(path);
  return svg;
}
function details(item) {
  const visited = item.HasEaten === true ? '☑ 已去过' : item.HasEaten === false ? '× 没去过' : '';
  return [item.Category, cinemaFormat(item), item.Rating, visited, !located(item) ? '未定位' : item.Approximate ? '参考位置' : '', item.Address].filter(Boolean).join(' · ');
}
const filterButtons = ['全部', '未定位', '已去过', ...groups.map(([name]) => name)].map(name => {
  const button = text('button', name, 'chip');
  button.addEventListener('click', () => {
    filter = name;
    selected = null;
    if (name === '风景') showScenic = true;
    if (name === 'KTV') showKtv = true;
    if (name === '商场') showMalls = true;
    if (name === '影院') showCinemas = true;
    if (name === '学校') showSchools = true;
    list.scrollTop = 0;
    render();
  });
  byId('filters').append(button);
  return button;
});
function select(item, marker, row) {
  if (selected) selected.removeAttribute('aria-current');
  selected = row;
  if (row) row.setAttribute('aria-current', 'true');
  if (marker) {
    map.easeTo({ center: [item.Lon, item.Lat], zoom: Math.max(map.getZoom(), 13) });
    if (!marker.getPopup().isOpen()) marker.togglePopup();
    refreshLabels();
  }
}
function trackPopup(popup) {
  popup.on('open', () => {
    if (activePopup !== popup) {
      const previous = activePopup;
      activePopup = popup;
      previous?.remove();
    }
    refreshLabels();
  });
  popup.on('close', () => {
    if (activePopup === popup) activePopup = null;
    refreshLabels();
  });
}
function markerFor(item, kind) {
  if (!map || !located(item)) return null;
  const category = kind === 'rail' ? '地铁' : group(item);
  const icon = text('div', '', 'map-marker');
  icon.title = item.Name;
  icon.dataset.kind = kind;
  icon.tabIndex = 0;
  icon.addEventListener('click', () => icon.focus({preventScroll: true}));
  enablePlaceCopy(icon, item);
  const pin = text('div', '', 'pin '+kind);
  pin.classList.toggle('approximate', item.Approximate === true);
  pin.style.setProperty('--pin', (mapIcons[category] ?? mapIcons['其他']).color);
  pin.append(mapIcon(category));
  icon.append(pin, text('span', item.Name, 'pin-label'));
  const format = cinemaFormat(item);
  if (format) icon.append(text('span', format, 'screen-badge' + (format === '巨幕' ? ' large-format' : '')));
  const popup = text('div', '');
  const popupName = text('strong', item.Name, 'popup-name');
  popupName.tabIndex = 0;
  popupName.addEventListener('click', () => popupName.focus({preventScroll: true}));
  enablePlaceCopy(popupName, item);
  popup.append(popupName, text('div', details(item)));
  if (item.Notes) popup.append(text('p', item.Notes, 'popup-note'));
  const info = new maplibregl.Popup({ offset: 16, closeOnClick: true }).setDOMContent(popup);
  trackPopup(info);
  const marker = new maplibregl.Marker({ element: icon }).setLngLat([item.Lon, item.Lat])
    .setPopup(info).addTo(map);
  markers.push(marker);
  refreshLabels();
  return marker;
}
function render() {
  const terms = search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const visitedOnly = filter === '已去过';
  const matches = item => (!visitedOnly || item.HasEaten === true)
    && terms.every(term => [item.Name,item.Category,item.Address,group(item)].join(' ').toLowerCase().includes(term));
  filterButtons.forEach(button => button.setAttribute('aria-pressed', String(button.textContent === filter)));
  byId('metro').setAttribute('aria-pressed', String(showMetro));
  byId('scenic').setAttribute('aria-pressed', String(showScenic));
  byId('ktv').setAttribute('aria-pressed', String(showKtv));
  byId('mall').setAttribute('aria-pressed', String(showMalls));
  byId('cinema').setAttribute('aria-pressed', String(showCinemas));
  byId('school').setAttribute('aria-pressed', String(showSchools));
  const customScenic = places.filter(item => group(item) === '风景' && located(item) && matches(item));
  const scenicNames = new Set(customScenic.map(item => item.Name));
  const builtInScenic = scenic.filter(item => !scenicNames.has(item.Name));
  const filtered = places.filter(item => (filter === '全部' || visitedOnly || (filter === '未定位' ? pending(item) : group(item) === filter)) && matches(item));
  if (filter === '风景' || visitedOnly) filtered.push(...builtInScenic.filter(matches));
  byId('count').textContent = filter + ' · ' + filtered.length + ' 个地点';
  const fragment = document.createDocumentFragment();
  const renderMarkers = [];
  for (const item of filtered) {
    const isScenic = group(item) === '风景';
    const isKtv = group(item) === 'KTV';
    const isMall = group(item) === '商场';
    const isCinema = group(item) === '影院';
    const isSchool = group(item) === '学校';
    let marker;
    const row = text('button', '', 'place');
    enablePlaceCopy(row, item);
    row.append(text('span', item.Name, 'name'), text('span', details(item), 'meta'));
    const note = item.Notes ? text('span', item.Notes, 'row-note') : null;
    if (note) { note.hidden = true; row.append(note); }
    row.addEventListener('click', () => {
      if (!marker) activePopup?.remove();
      if (note) note.hidden = !!marker;
      select(item, marker, row);
    });
    renderMarkers.push(() => {
      if ((isScenic && !showScenic) || (isKtv && !showKtv) || (isMall && !showMalls) ||
          (isCinema && !showCinemas) || (isSchool && !showSchools)) return;
      marker = markerFor(item, isScenic ? 'scenic' : isKtv ? 'ktv' : isMall ? 'mall' : isCinema ? 'cinema' : '');
      marker?.getElement().addEventListener('click', () => {
        select(item, null, row);
        row.scrollIntoView({ block: 'nearest' });
      });
    });
    fragment.append(row);
  }
  if (!filtered.length) fragment.append(text('p', '没有符合条件的地点。', 'empty'));
  list.replaceChildren(fragment);
  if (!map) return;
  markers.splice(0).forEach(marker => marker.remove());
  if (showMetro) transit.forEach(item => markerFor(item, 'rail'));
  const listed = new Set(filtered);
  if (showScenic) {
    if (!visitedOnly && filter !== '风景') builtInScenic.forEach(item => markerFor(item, 'scenic'));
    customScenic.filter(item => !listed.has(item)).forEach(item => markerFor(item, 'scenic'));
  }
  if (showKtv) places.filter(item => group(item) === 'KTV' && !listed.has(item) && matches(item))
    .forEach(item => markerFor(item, 'ktv'));
  if (showMalls) places.filter(item => group(item) === '商场' && !listed.has(item) && matches(item))
    .forEach(item => markerFor(item, 'mall'));
  if (showCinemas) places.filter(item => group(item) === '影院' && !listed.has(item) && matches(item))
    .forEach(item => markerFor(item, 'cinema'));
  if (showSchools) places.filter(item => group(item) === '学校' && !listed.has(item) && matches(item))
    .forEach(item => markerFor(item, 'school'));
  renderMarkers.forEach(draw => draw());
}
search.addEventListener('input', render);
byId('metro').addEventListener('click', () => { showMetro = !showMetro; render(); });
byId('scenic').addEventListener('click', () => { showScenic = !showScenic; render(); });
byId('ktv').addEventListener('click', () => { showKtv = !showKtv; render(); });
byId('mall').addEventListener('click', () => { showMalls = !showMalls; render(); });
byId('cinema').addEventListener('click', () => { showCinemas = !showCinemas; render(); });
byId('school').addEventListener('click', () => { showSchools = !showSchools; render(); });
render();

</script>
</body></html>

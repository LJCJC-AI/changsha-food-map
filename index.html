    render();
  });
  byId('filters').append(button);
  return button;
});
function select(item, marker, row) {
  if (selected) selected.removeAttribute('aria-current');
  selected = row;
  if (row) row.setAttribute('aria-current', 'true');
  if (marker) {
    map.easeTo({ center: [item.Lon, item.Lat], zoom: Math.max(map.getZoom(), 13) });
    if (!marker.getPopup().isOpen()) marker.togglePopup();
    refreshLabels();
  }
}
function trackPopup(popup) {
  popup.on('open', () => {
    if (activePopup !== popup) {
      const previous = activePopup;
      activePopup = popup;
      previous?.remove();
    }
    refreshLabels();
  });
  popup.on('close', () => {
    if (activePopup === popup) activePopup = null;
    refreshLabels();
  });
}
function markerFor(item, kind) {
  if (!map || !located(item)) return null;
  const category = kind === 'rail' ? '地铁' : group(item);
  const icon = text('div', '', 'map-marker');
  icon.title = item.Name;
  icon.dataset.kind = kind;
  icon.tabIndex = 0;
  icon.addEventListener('click', () => icon.focus({preventScroll: true}));
  enablePlaceCopy(icon, item);
  const pin = text('div', '', 'pin '+kind);
  pin.classList.toggle('approximate', item.Approximate === true);
  pin.style.setProperty('--pin', (mapIcons[category] ?? mapIcons['其他']).color);
  pin.append(mapIcon(category));
  icon.append(pin, text('span', item.Name, 'pin-label'));
  const popup = text('div', '');
  const popupName = text('strong', item.Name, 'popup-name');
  popupName.tabIndex = 0;
  popupName.addEventListener('click', () => popupName.focus({preventScroll: true}));
  enablePlaceCopy(popupName, item);
  popup.append(popupName, text('div', details(item)));
  if (item.Notes) popup.append(text('p', item.Notes, 'popup-note'));
  const info = new maplibregl.Popup({ offset: 16, closeOnClick: true }).setDOMContent(popup);
  trackPopup(info);
  const marker = new maplibregl.Marker({ element: icon }).setLngLat([item.Lon, item.Lat])
    .setPopup(info).addTo(map);
  markers.push(marker);
  refreshLabels();
  return marker;
}
function render() {
  const terms = search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const visitedOnly = filter === '已去过';
  const matches = item => (!visitedOnly || item.HasEaten === true)
    && terms.every(term => [item.Name,item.Category,item.Address,group(item)].join(' ').toLowerCase().includes(term));
  filterButtons.forEach(button => button.setAttribute('aria-pressed', String(button.textContent === filter)));
  byId('metro').setAttribute('aria-pressed', String(showMetro));
  byId('scenic').setAttribute('aria-pressed', String(showScenic));
  byId('ktv').setAttribute('aria-pressed', String(showKtv));
  byId('mall').setAttribute('aria-pressed', String(showMalls));
  const customScenic = places.filter(item => group(item) === '风景' && located(item) && matches(item));
  const scenicNames = new Set(customScenic.map(item => item.Name));
  const builtInScenic = scenic.filter(item => !scenicNames.has(item.Name));
  const filtered = places.filter(item => (filter === '全部' || visitedOnly || (filter === '未定位' ? pending(item) : group(item) === filter)) && matches(item));
  if (filter === '风景') filtered.push(...builtInScenic.filter(matches));
  byId('count').textContent = filter + ' · ' + filtered.length + ' 个地点';
  const fragment = document.createDocumentFragment();
  const renderMarkers = [];
  for (const item of filtered) {
    const isScenic = group(item) === '风景';
    const isKtv = group(item) === 'KTV';
    const isMall = group(item) === '商场';
    let marker;
    const row = text('button', '', 'place');
    enablePlaceCopy(row, item);
    row.append(text('span', item.Name, 'name'), text('span', details(item), 'meta'));
    const note = item.Notes ? text('span', item.Notes, 'row-note') : null;
    if (note) { note.hidden = true; row.append(note); }
    row.addEventListener('click', () => {
      if (!marker) activePopup?.remove();
      if (note) note.hidden = !!marker;
      select(item, marker, row);
    });
    renderMarkers.push(() => {
      if ((isScenic && !showScenic) || (isKtv && !showKtv) || (isMall && !showMalls)) return;
      marker = markerFor(item, isScenic ? 'scenic' : isKtv ? 'ktv' : isMall ? 'mall' : '');
      marker?.getElement().addEventListener('click', () => {
        select(item, null, row);
        row.scrollIntoView({ block: 'nearest' });
      });
    });
    fragment.append(row);
  }
  if (!filtered.length) fragment.append(text('p', '没有符合条件的地点。', 'empty'));
  list.replaceChildren(fragment);
  if (!map) return;
  markers.splice(0).forEach(marker => marker.remove());
  if (showMetro) transit.forEach(item => markerFor(item, 'rail'));
  const listed = new Set(filtered);
  if (showScenic) {
    if (!visitedOnly && filter !== '风景') builtInScenic.forEach(item => markerFor(item, 'scenic'));
    customScenic.filter(item => !listed.has(item)).forEach(item => markerFor(item, 'scenic'));
  }
  if (showKtv) places.filter(item => group(item) === 'KTV' && !listed.has(item) && matches(item))
    .forEach(item => markerFor(item, 'ktv'));
  if (showMalls) places.filter(item => group(item) === '商场' && !listed.has(item) && matches(item))
    .forEach(item => markerFor(item, 'mall'));
  renderMarkers.forEach(draw => draw());
}
search.addEventListener('input', render);
byId('metro').addEventListener('click', () => { showMetro = !showMetro; render(); });
byId('scenic').addEventListener('click', () => { showScenic = !showScenic; render(); });
byId('ktv').addEventListener('click', () => { showKtv = !showKtv; render(); });
byId('mall').addEventListener('click', () => { showMalls = !showMalls; render(); });
render();
</script>
</body></html>
